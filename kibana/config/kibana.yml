---
## Default Kibana configuration from Kibana base image.
## https://github.com/elastic/kibana/blob/main/src/dev/build/tasks/os_packages/docker_generator/templates/kibana_yml.template.ts
#
server.name: kibana
server.host: 0.0.0.0
elasticsearch.hosts: [ http://elasticsearch:9200 ]

monitoring.ui.container.elasticsearch.enabled: true
monitoring.ui.container.logstash.enabled: true

## Security credentials
#
elasticsearch.username: kibana_system
elasticsearch.password: ${KIBANA_SYSTEM_PASSWORD}

## Encryption keys (optional but highly recommended)
##
## Generate with either
##  $ docker compose up kibana-genkeys
##  $ openssl rand -hex 32
##
## https://www.elastic.co/docs/deploy-manage/security/self-setup
## https://www.elastic.co/docs/reference/kibana/commands/kibana-encryption-keys
#
xpack.security.encryptionKey: ${KIBANA_SECURITY_ENCRYPTION_KEY}
xpack.encryptedSavedObjects.encryptionKey: ${KIBANA_ENCRYPTED_SAVED_OBJECTS_ENCRYPTION_KEY}
xpack.reporting.encryptionKey: ${KIBANA_REPORTING_ENCRYPTION_KEY}

## Fleet
## https://www.elastic.co/docs/reference/kibana/configuration-reference/fleet-settings
##
## Same rule as the outputs below: policies for agents inside the 'elk' Docker
## network use the Docker-internal hostname; 'Detection Lab Endpoints' (agents
## outside Docker) uses FLEET_SERVER_PUBLIC_URL, a host-reachable address set
## in '.env'. Reuses Fleet's built-in default id so this updates the existing
## saved object in place instead of orphaning it.
#
xpack.fleet.fleetServerHosts:
  - id: fleet-default-fleet-server-host
    name: Default
    is_default: true
    host_urls: [ http://fleet-server:8220 ]
  - id: fleet-external-agents-host
    name: External agents Fleet Server
    host_urls: [ "${FLEET_SERVER_PUBLIC_URL}" ]

xpack.fleet.outputs:
  - id: fleet-default-output
    name: default
    type: elasticsearch
    hosts: [ http://elasticsearch:9200 ]
    is_default: true
    is_default_monitoring: true
  - id: fleet-external-agents-output
    name: External agents output
    type: elasticsearch
    hosts: [ "${ELASTICSEARCH_PUBLIC_URL}" ]

xpack.fleet.packages:
  - name: fleet_server
    version: latest
  - name: system
    version: latest
  - name: elastic_agent
    version: latest
  - name: docker
    version: latest
  - name: apm
    version: latest
  - name: endpoint
    version: latest

## 'overrides.agent.monitoring._runtime_experimental: process' pins agent
## self-monitoring to the legacy Beats runtime. The 9.5 OTel runtime default
## has a bug where DEGRADED status never clears. Applied to every policy below.
xpack.fleet.agentPolicies:
  - name: Fleet Server Policy
    id: fleet-server-policy
    description: Static agent policy for Fleet Server
    overrides:
      agent.monitoring._runtime_experimental: process
    monitoring_enabled:
      - logs
      - metrics
    package_policies:
      - name: fleet_server-1
        package:
          name: fleet_server
      - name: system-1
        package:
          name: system
      - name: elastic_agent-1
        package:
          name: elastic_agent
      - name: docker-1
        package:
          name: docker
  - name: Agent Policy APM Server
    id: agent-policy-apm-server
    description: Static agent policy for the APM Server integration
    overrides:
      agent.monitoring._runtime_experimental: process
    monitoring_enabled:
      - logs
      - metrics
    package_policies:
      - name: system-1
        package:
          name: system
      - name: elastic_agent-1
        package:
          name: elastic_agent
      - name: apm-1
        package:
          name: apm
        # See the APM package manifest for a list of possible inputs.
        # https://github.com/elastic/integrations/blob/d62b684/packages/apm/manifest.yml#L44-L174
        inputs:
          - type: apm
            vars:
              - name: host
                value: 0.0.0.0:8200
              - name: url
                value: http://apm-server:8200
  - name: Detection Lab Endpoints
    id: detection-lab-endpoints
    description: Policy for Elastic Defend agents enrolled from lab VMs
    fleet_server_host_id: fleet-external-agents-host
    data_output_id: fleet-external-agents-output
    monitoring_output_id: fleet-external-agents-output
    overrides:
      agent.monitoring._runtime_experimental: process
    monitoring_enabled:
      - logs
      - metrics
    package_policies:
      - name: system-1
        package:
          name: system
      - name: elastic_agent-1
        package:
          name: elastic_agent
    # 'endpoint' package policy is not preconfigured here: its default config is
    # generated by a server-side callback that only runs via the Fleet API, not
    # via kibana.yml preconfiguration. Add it through the API or the Kibana UI.
    # See extensions/fleet/README.md.
