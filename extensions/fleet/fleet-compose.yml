services:
  fleet-server:
    build:
      context: extensions/fleet/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    # Run as 'root' instead of 'elastic-agent' (uid 1000) to allow reading
    # 'docker.sock' and the host's filesystem.
    user: root
    volumes:
      - fleet-server:/usr/share/elastic-agent/state:Z
      - type: bind
        source: /var/lib/docker/containers
        target: /var/lib/docker/containers
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    environment:
      FLEET_SERVER_ENABLE: '1'
      FLEET_SERVER_INSECURE_HTTP: '1'
      FLEET_SERVER_HOST: 0.0.0.0
      FLEET_SERVER_POLICY_ID: fleet-server-policy
      # Fleet Server's own direct connection to Elasticsearch (agent status,
      # its own monitoring). Defaults to https://localhost:9200 if unset,
      # which does not resolve inside this container.
      FLEET_SERVER_ELASTICSEARCH_HOST: http://elasticsearch:9200
      # Fleet plugin in Kibana
      KIBANA_FLEET_SETUP: '1'
      # Enrollment.
      # (a) Auto-enroll using basic authentication
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-}
      # (b) Enroll using a pre-generated service token
      #FLEET_SERVER_SERVICE_TOKEN: <service_token>
    ports:
      - 8220:8220
    hostname: fleet-server
    # Elastic Agent does not retry failed connections to Kibana upon the initial enrollment phase.
    restart: on-failure
    networks:
      - elk
    depends_on:
      - elasticsearch
      - kibana

  # One-off script which creates the 'endpoint-1' (Elastic Defend) package
  # policy for the 'detection-lab-endpoints' agent policy via the Fleet API.
  # Can't be preconfigured in kibana.yml: Security Solution generates Defend's
  # default config in a callback that only runs on API-driven creation.
  #
  # Requires a running Kibana, so unlike the core 'setup' service this runs
  # after 'docker compose up', not before:
  #   docker compose -f docker-compose.yml -f extensions/fleet/fleet-compose.yml up fleet-setup
  fleet-setup:
    profiles:
      - setup
    build:
      context: setup/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    init: true
    volumes:
      - ./setup/fleet-entrypoint.sh:/entrypoint.sh:ro,Z
      - ./setup/lib.sh:/lib.sh:ro,Z
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      KIBANA_HOST: kibana
      FLEET_AGENT_POLICY_ID: detection-lab-endpoints
    networks:
      - elk
    depends_on:
      - kibana

volumes:
  fleet-server:
